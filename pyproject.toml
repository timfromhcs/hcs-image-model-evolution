[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hcs-image-evolution"
version = "0.1.0"
description = "Autonomous Image Model Evolution Lab for Distilled Qwen-Image-2.1 Diffusion Models"
readme = "README.md"
authors = [{ name = "timfromhcs", email = "timfromhcs@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "diffusers>=0.30.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "pydantic>=2.7.0",
    "huggingface_hub>=0.24.0",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "imagehash>=4.3.1",
    "safetensors>=0.4.3",
    "psutil>=5.9.8",
    "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0"
]
colab = [
    "xformers",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0"
]

[project.scripts]
hcs-evolver = "hcs_image_evolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "notebooks",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
