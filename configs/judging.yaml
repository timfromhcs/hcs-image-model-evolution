judging:
  ensemble:
    min_judges: 3
    candidate_models:
      - "Qwen/Qwen2.5-VL-72B-Instruct"
      - "meta-llama/Llama-3.2-11B-Vision-Instruct"
      - "mistralai/Pixtral-12B-2409"
    timeout_seconds: 60
    max_retries: 4
    backoff_factor: 2.0

  scoring_weights:
    quality: 0.25
    prompt_alignment: 0.20
    aesthetics: 0.15
    composition: 0.15
    detail: 0.10
    edit_fidelity: 0.10
    typography: 0.05
    disagreement_penalty_multiplier: 0.50
    artifact_penalty_multiplier: 1.00

  anti_reward_hacking:
    separate_judge_pool_for_eval: true
    unseen_benchmark_prompts: true
    min_embedding_entropy: 0.60
