data:
  mixture:
    synthetic_ratio: 0.50
    real_licensed_ratio: 0.25
    synthetic_edit_ratio: 0.15
    real_edit_ratio: 0.10

  licensing:
    allowed_licenses:
      - "mit"
      - "apache-2.0"
      - "cc0-1.0"
      - "cc-by-4.0"
      - "openrail"
    require_provenance: true
    reject_unlicensed: true

  quality_gates:
    min_overall_score: 0.70
    min_prompt_alignment: 0.72
    min_visual_quality: 0.70
    max_artifact_penalty: 0.25
    min_confidence: 0.65
    max_judge_disagreement: 0.35

  sharding:
    samples_per_shard: 1000
    format: "webdataset"
    compression: "gzip"
    metadata_format: "parquet"

  deduplication:
    exact_hash: true
    phash_max_distance: 6
    dhash_max_distance: 6
    semantic_similarity_threshold: 0.92

  resolutions:
    buckets:
      - [768, 768]
      - [1024, 1024]
      - [1152, 896]
      - [896, 1152]
      - [1280, 768]
      - [768, 1280]
      - [1536, 1024]
      - [2048, 2048]
